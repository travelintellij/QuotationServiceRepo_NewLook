<div class="section-title" th:fragment="_quotationInsurance" th:style="${manualConfigurationEntity.insuranceStartNewPage  ? 'padding:0px;page-break-inside: avoid;page-break-before:always;' : 'padding:0px;page-break-inside: avoid'} ">
    <p>Insurance Section</p>
</div>

<div th:fragment="_quotationInsurance2" >
    <table class="services" style="page-break-inside: avoid">
        <tr style="page-break-inside: avoid">
            <th style="">Country</th>
            <th style="">Insurance Name</th>
            <th style="">Start Date</th>
            <th style="">End Date</th>
            <th style="">Provider</th>
            <th style="">Coverage</th>
            <th style="">Adults</th>
            <th style="">Children</th>
            <th style="">Infants</th>
        </tr>

        <th:block th:each="insuranceObj : ${InsuranceVOList}" >
        <tr style="page-break-inside: avoid">
            <td th:text="${insuranceObj.countryName}"> </td>
            <td th:text="${insuranceObj.insuranceName}"> </td>
            <td th:text="${#dates.format(insuranceObj.coverageStartDate, 'dd-MM-yyyy')}"> </td>
            <td th:text="${#dates.format(insuranceObj.coverageEndDate, 'dd-MM-yyyy')}"> </td>
            <td th:text="${insuranceObj.insuranceProviderName}"> </td>
            <td th:text="${insuranceObj.coverageAmount} + ' ' + ${insuranceObj.coverageCurrency}"> </td>
            <td th:text="${insuranceObj.adults}"> </td>
            <td th:text="${insuranceObj.children}"> </td>
            <td th:text="${insuranceObj.infant}"> </td>
        </tr>
        <tr th:if="${not #strings.isEmpty(insuranceObj.remarks)}" style="page-break-inside: avoid">
            <td colspan="9">[[${insuranceObj.remarks}]]</td>
        </tr>
        </th:block>
    </table>
    <br/>
    <span th:if="${manualConfigurationEntity.insuranceCancellationPolicyDisplay } ">
        <table class="services" style="page-break-inside: avoid">
            <tr style="page-break-inside: avoid">
                <th style="">Insurance Remarks</th>
            </tr>
            <tr style="page-break-inside: avoid">
                <td style="text-align:left;"><pre>[[${manualConfigurationEntity.insuranceCancellationPolicy}]]</pre></td>
            </tr>
        </table>

    </span>
    <hr/>
</div>
