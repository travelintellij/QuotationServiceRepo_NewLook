<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="_quotationItinerary" style="page-break-before: always;">
    <table class="services">
        <tr>
            <td style="text-align: left; padding: 20px; background-color: #fdfdfd;">
                <h2 style="color: brown; margin-top: 0; font-size: 18pt; border-bottom: 2px solid brown; padding-bottom: 5px;">Tentative Itinerary: <span th:text="${ITINERARY_OBJ.title}">Itinerary Title</span></h2>
                <div th:utext="${ITINERARY_OBJ.description}" style="margin-bottom: 25px; font-style: italic; color: #444;">Itinerary Description</div>
                
                <div th:each="day : ${ITINERARY_DAYS}" style="margin-bottom: 20px; background-color: white; border: 1px solid #ddd; padding: 15px; border-radius: 5px;">
                    <div style="background-color: #f8f8f8; margin: -15px -15px 15px -15px; padding: 10px 15px; border-bottom: 1px solid #eee;">
                        <h3 style="color: brown; margin: 0; font-size: 12pt;">
                            Day <span th:text="${day.dayNumber}">1</span>: <span th:text="${day.title}">Day Title</span>
                        </h3>
                    </div>
                    <div th:utext="${day.description}" style="color: #333; line-height: 1.5; font-size: 10pt;">Day Description</div>
                </div>
            </td>
        </tr>
    </table>
</div>

<div th:fragment="_quotationItinerary2">
    <!-- Optional secondary fragment if needed for layout consistency -->
</div>

</body>
</html>
