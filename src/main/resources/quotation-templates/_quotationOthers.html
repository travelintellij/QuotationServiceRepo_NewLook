<div class="section-title" th:fragment="_quotationOthers" th:style="${manualConfigurationEntity.othersStartNewPage  ? 'padding:0px;page-break-inside: avoid;page-break-before:always;' : 'padding:0px;page-break-inside: avoid'} ">
    <p>Others Services Section</p>
</div>

<div th:fragment="_quotationOthers2" >
    <table class="services" style="page-break-inside: avoid">
        <tr style="page-break-inside: avoid">
            <th style="">Service Name</th>
            <th style="">Service Details</th>
            <th style="">Service Date</th>
        </tr>

        <th:block th:each="othersObj : ${OthersVOList}" >
        <tr style="page-break-inside: avoid">
            <td th:text="${othersObj.serviceName}"> </td>
            <td th:text="${othersObj.serviceDetails}"> </td>
            <td th:text="${#dates.format(othersObj.serviceDate, 'dd-MM-yyyy')}"> </td>
        </tr>
        </th:block>
    </table>
    <br/>
    <span th:if="${manualConfigurationEntity.otherCancellationPolicyDisplay } ">
        <table class="services" style="page-break-inside: avoid">
            <tr style="page-break-inside: avoid">
                <th style="">Others Remarks</th>
            </tr>
            <tr style="page-break-inside: avoid">
                <td style="text-align:left;"><pre>[[${manualConfigurationEntity.otherCancellationPolicy}]]</pre></td>
            </tr>
        </table>

    </span>
    <hr/>
</div>
