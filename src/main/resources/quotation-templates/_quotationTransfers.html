<div class="section-title" th:fragment="_quotationTransfers" th:style="${manualConfigurationEntity.transfersStartNewPage  ? 'padding:0px;page-break-inside: avoid;page-break-before:always;' : 'padding:0px;page-break-inside: avoid'} ">
    <p>Transfers Section</p>
</div>

<div th:fragment="_quotationTransfers2" >
    <table class="services" style="page-break-inside: avoid">
        <tr style="page-break-inside: avoid">
            <th style="">Pickup</th>
            <th style="">From</th>
            <th style="width=15%;">Pickup Details</th>
            <th style="width:10%;">Date</th>
            <th style="">Drop</th>
            <th style="">To</th>
            <th style="width:15%;">Drop Details</th>
            <th style="">Type</th>
            <th style="width:12%">Guests </th>
        </tr>

        <th:block th:each="transfersObj : ${TransfersVOList}" >
        <tr style="page-break-inside: avoid">
            <td th:text="${transfersObj.pickUpCityName}"> </td>
            <td th:text="${transfersObj.pickUpFromDesc}"> </td>
            <td th:text="${transfersObj.pickUpFromName}"> </td>
            <td th:text="${#dates.format(transfersObj.transferDate, 'dd-MM-yyyy')}"> </td>
            <td th:text="${transfersObj.dropToCityName}"> </td>
            <td th:text="${transfersObj.dropToDesc}"> </td>
            <td th:text="${transfersObj.dropToName}"> </td>
            <td th:text="${transfersObj.transferTypeName}"> </td>
            <td th:text="${transfersObj.adults} + ' A | ' +  ${transfersObj.children} + ' C | '+  ${transfersObj.infant} + ' I'"> </td>
        </tr>
        <tr th:if="${not #strings.isEmpty(transfersObj.remarks)}" style="page-break-inside: avoid">
            <td colspan="9">[[${transfersObj.remarks}]]</td>
        </tr>
        </th:block>
    </table>
    <br/>
    <span th:if="${manualConfigurationEntity.transfersCancellationPolicyDisplay } ">
        <table class="services" style="page-break-inside: avoid">
            <tr style="page-break-inside: avoid">
                <th style="">Transfers Remarks</th>
            </tr>
            <tr style="page-break-inside: avoid">
                <td style="text-align:left;"><pre>[[${manualConfigurationEntity.transfersCancellationPolicy}]]</pre></td>
            </tr>
        </table>

    </span>
    <hr/>
</div>
